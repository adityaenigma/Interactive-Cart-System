<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Athenix</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="shortcut icon" href="assets/athenix.png" type="image/x-icon" />
  </head>
  <body>
    <nav>
      <div class="logo">Athenix</div>
      <ul class="navlinks">
        <li><a href="index.html" class="page-link">Home</a></li>
        <li>
          <a href="cart.html" class="page-link">Cart</a>
          <span class="cart-item-count">2</span>
        </li>
        <li><a href="whishlist.html" class="page-link">Whishlist</a></li>
      </ul>
    </nav>

    <div class="container cart-container">
      <h2>Your Shopping Cart</h2>

      <table
        border="1"
        width="100%"
        style="border-collapse: collapse; margin-top: 20px"
      >
        <thead>
          <tr>
            <th>Product Image</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td align="center">
              <img src="assets/blue_shirt.png" alt="blue_shirt" width="80" />
            </td>
            <td>Premium Blue Shirt</td>
            <td>₹1,499</td>
            <td align="center">
              <input type="number" value="1" min="1" />
            </td>
            <td>₹1,499</td>
            <td align="center">
              <button>Remove</button>
            </td>
          </tr>

          <tr>
            <td align="center">
              <img src="assets/peach_shirt.png" alt="peach_shirt" width="80" />
            </td>
            <td>Aesthetics Peach Shirt</td>
            <td>₹1,499</td>
            <td align="center">
              <input type="number" value="1" min="1" />
            </td>
            <td>₹1,499</td>
            <td align="center">
              <button>Remove</button>
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4" align="right"><strong>Total Amount:</strong></td>
            <td colspan="2"><strong>₹2,998</strong></td>
          </tr>
        </tfoot>
      </table>

      <div style="margin-top: 20px; text-align: right">
        <button class="buy-btn">Proceed to Checkout</button>
      </div>
    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
